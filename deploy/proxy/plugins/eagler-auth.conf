# Config for EaglerAuth
# Place this file at deploy/proxy/plugins/eagler-auth.conf or build the plugin and edit properties inside the jar at src/main/resources/eagler-auth.properties
# Recommended: run a lightweight auth service that validates session tokens (e.g., OAuth, custom session DB)

# Example values
enabled=true
auth_url=http://localhost:8080/auth
kick_message=You are not authorized to join this server.
